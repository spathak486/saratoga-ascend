    <!-- Spark Dot -->
    <circle cx="55" cy="10" r="5" fill="#e11d48" />
  </g>

  <!-- Typography -->
  <!-- Brand Title -->
  <text x="105" y="48" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" fill="#022e4c" letter-spacing="1.5">SARATOGA</text>
  <text x="105" y="74" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="22" fill="#e11d48" letter-spacing="4">ASCEND</text>
  
  <!-- Subtitle -->
  <text x="270" y="74" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="12" fill="#64748b" letter-spacing="1">|  ADMIN</text>
