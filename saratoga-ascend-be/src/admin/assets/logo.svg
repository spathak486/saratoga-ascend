      <stop offset="0%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Emblem / Crest -->
